name: Retrain RL Route Model

on:
  schedule:
    - cron: '0 2 * * 0'   # Weekly — Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      total_timesteps:
        description: 'PPO training timesteps (default 50 000 for weekly runs)'
        required: false
        default: '50000'
        type: string

jobs:
  retrain:
    name: Retrain PPO route model
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Write permission so the job can push the updated model back
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and ML dependencies
        run: pip install -e "." --quiet

      - name: Train PPO route model
        env:
          TOTAL_TIMESTEPS: ${{ github.event.inputs.total_timesteps || '50000' }}
          # Minimal settings so model imports don't fail at import-time validation
          ENVIRONMENT: development
          SECRET_KEY: ci-placeholder-not-used
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: |
          python -c "
          import os
          from packages.ml.training.train_agent import train_agent
          timesteps = int(os.environ['TOTAL_TIMESTEPS'])
          print(f'Training PPO for {timesteps:,} timesteps...')
          train_agent(total_timesteps=timesteps)
          print('Training complete.')
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-optimization-model-${{ github.run_id }}
          path: packages/ml/models/route_optimization_model.zip
          retention-days: 90

      - name: Commit updated model to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ml/models/route_optimization_model.zip
          if git diff --cached --quiet; then
            echo "Model unchanged — nothing to commit."
          else
            git commit -m "chore: retrain RL route model [run ${{ github.run_id }}]"
            git push origin HEAD:main
          fi
